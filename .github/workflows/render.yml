name: Render the site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          # `quarto publish gh-pages` needs the gh-pages branch history.
          fetch-depth: 0

      # Nothing on this site executes at render time (_quarto.yml sets
      # `execute: eval: false` and `freeze: auto`), so Quarto alone is enough.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.43"

      # A pull request only has to prove the site still builds.
      - name: Render
        if: github.event_name == 'pull_request'
        run: quarto render

      # GitHub Pages serves the gh-pages branch, so that is what a push to
      # main deploys to. The rendered site is not kept in the repository.
      - name: Render and publish
        if: github.event_name != 'pull_request'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
